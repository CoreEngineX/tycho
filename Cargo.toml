[package]
name = "tycho"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A backup daemon that treats git as the storage format"
license = "Apache-2.0"
readme = "README.md"
keywords = ["backup", "git", "daemon", "restore"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "tycho"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
globset = "0.4"
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
toml_edit = "0.25.13"
unicode-normalization = "0.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# mirrors the set `cex ci-check --rust` gates, which stays the source of truth
cast_lossless = "warn"
explicit_iter_loop = "warn"
format_push_string = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
map_unwrap_or = "warn"
missing_panics_doc = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
single_match_else = "warn"
uninlined_format_args = "warn"
unreadable_literal = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3"
